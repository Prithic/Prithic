name: Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate Space Shooter Animation
        uses: czl9707/gh-space-shooter@v1.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          output-path: space-shooter.webp
          strategy: random
          fps: 40

      - name: Commit Space Shooter Animation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Space Shooter Animation"
          file_pattern: space-shooter.webp
